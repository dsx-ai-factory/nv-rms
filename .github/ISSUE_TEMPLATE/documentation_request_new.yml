name: Documentation - New Documentation Request
description: Request additions to NVIDIA Rack Management Service documentation
title: "docs: "
labels: ["doc"]
type: Documentation

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to improve our documentation.

  - type: dropdown
    id: criticality
    attributes:
      label: How would you describe the priority of this documentation request?
      options:
        - Critical (currently preventing usage)
        - High
        - Medium
        - Low (would be nice)
      default: 2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe the missing documentation
      description: Explain what is missing and who needs it.
      placeholder: A config option, RPC, workflow, or deployment path is used but not documented.
    validations:
      required: true

  - type: textarea
    id: suggested_location
    attributes:
      label: Suggested location
      description: Optional. Suggest where this documentation should live.
      placeholder: "example: README.md, helm/README.md, docs/"

  - type: checkboxes
    id: code_of_conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/NVIDIA/nv-rms/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow NVIDIA Rack Management Service's Code of Conduct.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Submission checklist
      options:
        - label: I have searched the open documentation issues and found no duplicate for this request.
          required: true
