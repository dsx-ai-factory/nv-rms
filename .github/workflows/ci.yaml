name: RMS CI

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"
      - "v[0-9].[0-9].[0-9]-rc[0-9]*"

env:
  CARGO_INCREMENTAL: 0
  CARGO_HOME: ${{ github.workspace }}/cargo
  FF_USE_FASTZIP: "true"
  GIT_SUBMODULE_STRATEGY: recursive

jobs:
  prepare:
    runs-on: linux-amd64-cpu4
    outputs:
      version: ${{ steps.version.outputs.version }}
      helm_version: ${{ steps.version.outputs.helm_version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate version
        id: version
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # On a tagged commit this collapses to the clean tag (e.g. v2.0.0-rc.1);
          # otherwise the long dev form (v2.0.0-3-gabc1234). nv-rms has NO release
          # tags yet, so fall back to a synthetic v0.0.0 dev version off HEAD.
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            VERSION=$(git describe --tags --first-parent --always)
          else
            VERSION="v0.0.0-0-g${SHORT_SHA}"
          fi

          # The chart version is an independently managed artifact version that
          # is declared in helm/Chart.yaml; it is not derived from VERSION.
          HELM_VERSION=$(awk '/^version:/{print $2; exit}' helm/Chart.yaml)

          # Strict SemVer validation (official regex, POSIX ERE).
          SEMVER_STRICT='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'
          if [[ ! "$HELM_VERSION" =~ $SEMVER_STRICT ]]; then
            echo "::error::helm/Chart.yaml version '${HELM_VERSION}' failed strict SemVer validation"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "helm_version=${HELM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Calculated VERSION=${VERSION}  HELM_VERSION=${HELM_VERSION}  SHORT_SHA=${SHORT_SHA}"

          {
            echo "## 📦 Build Version"
            echo "| Variable | Value |"
            echo "|----------|-------|"
            echo "| VERSION | \`${VERSION}\` |"
            echo "| HELM_VERSION | \`${HELM_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish gate (single source of truth for the release/publish jobs):
      # publish on main, release/**, any tag, or an explicit `ci-publish` opt-in
      # in the commit message. Mirrors the GitLab push-to-registry rules.
      - name: Compute publish gate
        id: publish
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          publish=false
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/release/*|refs/tags/*) publish=true ;;
          esac
          if printf '%s' "${COMMIT_MESSAGE}" | grep -q 'ci-publish'; then publish=true; fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Publish gate: ${publish}"

  build-container-x86_64:
    needs: prepare
    runs-on: linux-amd64-cpu32
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build builder image (amd64)
        uses: NVIDIA/dsx-github-actions/.github/actions/docker-build@v1.17.0
        with:
          image: rms-builder
          tags: ${{ needs.prepare.outputs.version }}-amd64
          target: builder
          platforms: linux/amd64
          push: "false"
          cache-scope: build-container-amd64
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

  build-container-aarch64:
    needs: prepare
    runs-on: linux-arm64-cpu32
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build builder image (arm64)
        uses: NVIDIA/dsx-github-actions/.github/actions/docker-build@v1.17.0
        with:
          image: rms-builder
          tags: ${{ needs.prepare.outputs.version }}-arm64
          target: builder
          platforms: linux/arm64
          push: "false"
          cache-scope: build-container-arm64
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

  lint-police:
    needs: [prepare, build-container-x86_64]
    runs-on: linux-amd64-cpu16
    timeout-minutes: 120
    env:
      BUILDER_IMAGE: rms-builder:${{ needs.prepare.outputs.short_sha }}-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # build-container warms the GHA layer cache (push:false, no load), leaving
      # no runnable image; rebuild the builder target here with load:true (cache
      # hit on the compile layer) so the lints can run inside it via `docker run`.
      - name: Build builder image (amd64)
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=build-container-amd64
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

      - name: Run clippy
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: docker run --rm "$BUILDER_IMAGE" cargo clippy --workspace -- -D warnings

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: docker run --rm "$BUILDER_IMAGE" cargo fmt --all -- --check

  # Test + coverage: matrixed across both arches (behaviour can diverge by arch,
  # so unlike lint this must run on each). Lint lives in `lint-police` above.
  test:
    needs: [prepare, build-container-x86_64, build-container-aarch64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: linux-amd64-cpu32 }
          - { arch: arm64, runner: linux-arm64-cpu32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Local builder image these checks run inside (see "Build builder image").
      BUILDER_IMAGE: rms-builder:${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
      # Per-run, per-arch names so parallel matrix legs on a shared self-hosted
      # host never collide.
      PG_NET: rms-pg-net-${{ github.run_id }}-${{ matrix.arch }}
      PG_NAME: rms-pg-${{ github.run_id }}-${{ matrix.arch }}
      # Tests reach Postgres by container name over the per-run docker network.
      DATABASE_URL: postgres://postgres:postgres@rms-pg-${{ github.run_id }}-${{ matrix.arch }}:5432/rms_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The build-container job (dsx docker-build action) builds this same
      # target with push:false, which only warms the GHA layer cache — it leaves
      # no runnable image on the runner. Rebuild the builder target here with
      # load:true, reusing that warm cache (so the cargo compile layer is a cache
      # hit), so the cargo checks below can run inside it via `docker run`.
      - name: Build builder image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=build-container-${{ matrix.arch }}
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create "$PG_NET"
          docker run -d --name "$PG_NAME" --network "$PG_NET" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rms_test \
            postgres:16-alpine
          echo "Waiting for Postgres to accept connections..."
          for i in $(seq 1 30); do
            if docker exec "$PG_NAME" pg_isready -U postgres -d rms_test >/dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready within 60s"; exit 1

      - name: cargo test
        run: |
          docker run --rm --network "$PG_NET" \
            -e DATABASE_URL="$DATABASE_URL" \
            "$BUILDER_IMAGE" cargo test --workspace --release

      - name: Stop Postgres
        if: ${{ always() }}
        run: |
          docker rm -f "$PG_NAME" >/dev/null 2>&1 || true
          docker network rm "$PG_NET" >/dev/null 2>&1 || true

  coverage:
    needs: [prepare, build-container-x86_64]
    if: >-
      ${{ github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/heads/release/')
          || startsWith(github.ref, 'refs/tags/')
          || contains(github.event.head_commit.message, 'ci-run-complete-pipeline') }}
    runs-on: linux-amd64-cpu32
    timeout-minutes: 120
    env:
      BUILDER_IMAGE: rms-builder:${{ needs.prepare.outputs.short_sha }}-amd64
      PG_NET: rms-pg-net-${{ github.run_id }}-cov
      PG_NAME: rms-pg-${{ github.run_id }}-cov
      DATABASE_URL: postgres://postgres:postgres@rms-pg-${{ github.run_id }}-cov:5432/rms_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same local-build-then-run pattern as lint-police / test: build-container
      # only warms the cache, so rebuild the builder target with load:true.
      - name: Build builder image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=build-container-amd64
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker network create "$PG_NET"
          docker run -d --name "$PG_NAME" --network "$PG_NET" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rms_test \
            postgres:16-alpine
          echo "Waiting for Postgres to accept connections..."
          for i in $(seq 1 30); do
            if docker exec "$PG_NAME" pg_isready -U postgres -d rms_test >/dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready within 60s"; exit 1

      - name: cargo llvm-cov (coverage)
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/coverage"
          docker run --rm --network "$PG_NET" \
            -e DATABASE_URL="$DATABASE_URL" \
            -v "${{ github.workspace }}/coverage:/cov" \
            "$BUILDER_IMAGE" bash -c '
              set -euo pipefail
              cargo llvm-cov --workspace --release --cobertura --output-path /cov/cobertura.xml
              cargo llvm-cov report --release
            '

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/cobertura.xml
          if-no-files-found: warn

      - name: Stop Postgres
        if: ${{ always() }}
        run: |
          docker rm -f "$PG_NAME" >/dev/null 2>&1 || true
          docker network rm "$PG_NET" >/dev/null 2>&1 || true

  run-benchmarks:
    needs: [prepare, build-container-x86_64, build-container-aarch64, test]
    if: ${{ github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, 'ci-benchmarks') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: linux-amd64-cpu32 }
          - { arch: arm64, runner: linux-arm64-cpu32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BUILDER_IMAGE: rms-builder:${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild the builder target locally (cache hit) so `cargo bench` can run
      # inside it — same local-build-then-run pattern as lint-police / test.
      - name: Build builder image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.BUILDER_IMAGE }}
          cache-from: type=gha,scope=build-container-${{ matrix.arch }}
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}

      - name: Run cargo bench
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/benchmark-results-${{ matrix.arch }}"
          docker run --rm \
            -v "${{ github.workspace }}/benchmark-results-${{ matrix.arch }}:/out" \
            "$BUILDER_IMAGE" \
            bash -c 'set -euo pipefail; cargo bench; cp -r target/criterion /out/ 2>/dev/null || true'

      - name: Upload benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.arch }}
          path: benchmark-results-${{ matrix.arch }}/
          if-no-files-found: warn

  # Release container build. On non-publish events this is pure validation of the
  # Dockerfile `release` stage (push:false) — the actual publish happens in
  # publish-image below, so this is gated to non-publish refs to avoid building
  # the release image twice on main/release/tags.
  build-release:
    needs: [prepare, build-container-x86_64, build-container-aarch64]
    if: ${{ needs.prepare.outputs.publish != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: linux-amd64-cpu32 }
          - { arch: arm64, runner: linux-arm64-cpu32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=build-container-${{ matrix.arch }}
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

  publish-image:
    needs: [prepare, build-container-x86_64, build-container-aarch64, test]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: linux-amd64-cpu32 }
          - { arch: arm64, runner: linux-arm64-cpu32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: ./.github/actions/docker-auth
        with:
          registry: ${{ vars.RMS_DEV_REGISTRY }}
          username: ${{ secrets.RMS_DEV_REGISTRY_USERNAME }}
          token: ${{ secrets.RMS_DEV_REGISTRY_PASSWORD }}

      - name: Build and push release image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ vars.RMS_DEV_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-container-${{ matrix.arch }}
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_DESCRIBE=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

  publish-manifest:
    needs: [prepare, publish-image]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: ./.github/actions/docker-auth
        with:
          registry: ${{ vars.RMS_DEV_REGISTRY }}
          username: ${{ secrets.RMS_DEV_REGISTRY_USERNAME }}
          token: ${{ secrets.RMS_DEV_REGISTRY_PASSWORD }}

      - name: Create and inspect multi-arch manifest
        env:
          IMAGE: ${{ vars.RMS_DEV_IMAGE }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # Helm chart validation. Lints + template-renders the chart on every run via
  # the shared dsx helm-validate action, and guards the chart version: if any
  # chart package input changed the version must have been bumped. The chart
  # version is independent of the RMS release version.
  helm-validate:
    needs: prepare
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # bump check diffs against the previous commit

      - name: Guard chart version (bump)
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Bump check: if chart package inputs changed vs the previous commit,
          # helm/Chart.yaml 'version:' must have changed too.
          BASE="${BEFORE_SHA:-}"
          if [ -n "${BASE}" ] && [ "${BASE}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BASE}" 2>/dev/null; then
            PKG='^helm/(Chart\.yaml|values\.yaml|values\.schema\.json|\.helmignore|templates/|crds/|charts/)'
            if git diff --name-only "${BASE}" HEAD | grep -qE "${PKG}"; then
              if ! git diff "${BASE}" HEAD -- helm/Chart.yaml | grep -qE '^[-+]version:'; then
                echo "::error::Helm chart inputs changed but helm/Chart.yaml version was not bumped. Run ./helm/scripts/bump-chart-version.sh dev {patch|minor|major}"
                exit 1
              fi
            fi
          else
            echo "Chart bump check skipped (no usable base SHA)."
          fi

      - name: Validate Helm chart
        uses: NVIDIA/dsx-github-actions/.github/actions/helm-validate@v1.17.0
        with:
          chart-path: helm
          lint: 'true'
          template: 'true'
          valueOverrides: '["global.image.tag=validate", "apiServer.tls.enabled=false"]'

  # Package + push the Helm chart to NGC. Gated to tags and release/** branches —
  # chart versions are deliberate, versioned artifacts (Chart.yaml-driven), not
  # pushed on every main merge (mirrors GitLab's .helm-chart-push-rules). Unified
  # registry: the NGC token is the shared registry secret; the org/team path is a
  # repo VARIABLE. ngc-duplicate:fail so re-pushing an unbumped version fails.
  helm-publish:
    needs: [prepare, helm-validate]
    if: ${{ startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Chart version is Chart.yaml's declared version (matches the bump guard);
      # app-version is the git-describe VERSION.
      - name: Package and push Helm chart to NGC
        uses: NVIDIA/dsx-github-actions/.github/actions/helm-package-push@v1.17.0
        with:
          chart-path: helm
          chart-version: ${{ needs.prepare.outputs.helm_version }}
          app-version: ${{ needs.prepare.outputs.version }}
          lint: 'false'
          ngc-key: ${{ secrets.RMS_DEV_REGISTRY_PASSWORD }}
          ngc-path: ${{ vars.RMS_DEV_NGC_PATH }}
          ngc-duplicate: fail

  security-codeql-scan:
    name: CodeQL Security Analysis
    needs: prepare
    runs-on: linux-amd64-cpu8
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run CodeQL Scan
        uses: NVIDIA/dsx-github-actions/.github/actions/codeql-scan@20dc10dda4fa9f8f0380a47cd9a7800d3da3dcf3
        with:
          languages: 'rust'
          build-mode: 'none'
          category: '/language:rust'
          upload-sarif: 'false'
          post-pr-comment: 'false'
          fail-on-findings: 'true'
          fail-on-severity: 'error'

  security-secret-scan:
    name: Secret Scan with TruffleHog
    needs: prepare
    runs-on: linux-amd64-cpu8
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for secret scanning

      - name: Run TruffleHog Scan
        uses: NVIDIA/dsx-github-actions/.github/actions/trufflehog-scan@9a9ce3a7770a8b53d2726afa920be3276bc3ddd7
        with:
          extra-args: '--results=verified,unknown --only-verified'
          post-pr-comment: 'false'
          fail-on-findings: 'true'

  markdownlint:
    name: Markdown Lint
    needs: prepare
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run markdownlint-cli2
        run: |
          docker run --rm -v "${{ github.workspace }}:/workdir" \
            davidanson/markdownlint-cli2:v0.17.2 "**/*.md"

  # Slack notification via nico's ported reusable workflow. Runs after every job
  # (always()), so it fires on all three triggers this workflow allows: PR
  # (pull-request/*), main, and tags. Overall status is computed from the needs
  # context. Channel is a repo VARIABLE; the bot token a repo SECRET. The slack
  # steps are non-fatal (errors:'false'), so a missing token/channel never fails
  # CI — and it is intentionally NOT part of core-ci-pass (notify is a
  # side-effect, not a merge gate).

  # TODO: Uncomment when the app is approved for slack notifications
  # notify:
  #   needs: [prepare, build-container-x86_64, build-container-aarch64, lint-police, test, coverage, build-release, publish-image, publish-manifest, helm-validate, helm-publish, security-codeql-scan, security-secret-scan, markdownlint]
  #   if: ${{ always() }}
  #   uses: ./.github/workflows/notify-build-status.yml
  #   with:
  #     version: ${{ needs.prepare.outputs.version }}
  #     workflow-name: "RMS CI"
  #     channel-id: ${{ vars.RMS_SLACK_CHANNEL_ID }}
  #     needs-context: ${{ toJson(needs) }}
  #     notify-on-success: true
  #     notify-on-partial: true
  #     notify-on-failure: true
  #   secrets:
  #     slack-bot-token: ${{ secrets.RMS_SLACK_BOT_TOKEN }}

  core-ci-pass:
    needs: [prepare, build-container-x86_64, build-container-aarch64, lint-police, test, coverage, build-release, publish-image, publish-manifest, helm-validate, helm-publish, security-codeql-scan, security-secret-scan, markdownlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' | jq .
          echo '${{ toJSON(needs) }}' \
            | jq -e 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | length == 0' >/dev/null \
            || { echo "::error::one or more required jobs did not succeed"; exit 1; }
          echo "All required jobs passed."
