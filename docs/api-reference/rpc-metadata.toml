target = "ephemeral"
poll_with = "GetJobStatus"
operations_page = "operations/switch-management.md"
result_json = "a JSON-encoded `ScaleUpFabricStatus` for successful no-layout and full-capacity layout jobs; partial layouts use `InspectScaleUpFabrics` for live status"
note = "Layout requests require matching deployment rules and the complete physical switch inventory. Without layout, RMS validates every node ID and type, then configures only switches."
[rpcs."RackManagerV2/ConfigureScaleUpFabricManager".grpc_errors]
INVALID_ARGUMENT = "The topology, inventory, or layout request is invalid. No job starts."
FAILED_PRECONDITION = "Physical discovery, deployment planning, or switch ownership prevents admission. No configuration worker starts."
INTERNAL = "Job admission or coordinator state fails internally. No configuration worker starts."
UNIMPLEMENTED = "Layout configuration has no installed deployment catalog or the switch family is unsupported. No job starts."

