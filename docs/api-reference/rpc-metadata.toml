# Curated metadata for the generated RMS gRPC API reference.
#
# The protos (fern/proto/*.proto) define the request and response shapes and
# the RPC descriptions. This file adds what the protos cannot express:
# whether an RPC is synchronous or asynchronous, which RPC polls its job, and
# whether it targets registered or caller-supplied nodes.
#
# `just api-ref-check` fails when:
#   - an RPC in the protos has no entry here, or an entry has no RPC;
#   - an RPC is marked `sync` but its proto comment says it is asynchronous;
#   - an asynchronous RPC has no response job field or names a missing poller.
#
# Fields per RPC (key: <Service>/<Method>):
#   category          Key into `categories` below. Required.
#   execution         sync | async-job | async-batch | sync-with-background.
#                     Required.
#                       sync                 Full result is in the response.
#                       async-job            Response carries one job ID.
#                       async-batch          Response carries a parent job ID
#                                            and usually one child job per node.
#                       sync-with-background Result is in the response, and
#                                            work continues in the background.
#   poll_with         Method that reports job progress. Required for async-*.
#   target            registered | ephemeral | none. Required.
#                       registered  Acts on nodes added with CreateNodes.
#                       ephemeral   Acts on nodes supplied in the request.
#                                   RMS does not store them.
#                       none        Acts on the service or a catalog.
#   operations_page   Path under docs/ of the page that explains the behavior.
#   result_json       What JobStatus.result_json holds, when verified.
#   grpc_errors       Map of gRPC status code to the condition, when verified.
#   note              Extra caution for readers, rendered as a callout.
#   client_command    rack_manager_client arguments after <host> <port>.
#   summary           One-line summary for the catalog. Defaults to the first
#                     sentence of the proto comment. Required when that
#                     sentence is longer than 220 characters.
#   override_async_check
#                     Set true to skip the "comment says asynchronous" check
#                     for a synchronous RPC whose comment only describes the
#                     asynchronous jobs it reports on.

version = 1

[categories.power-control]
title = "Power Control"
summary = "Read and change node power state, and run the coordinated rack cold reboot."

[categories.inventory]
title = "Inventory and Device Info"
summary = "Register nodes, list racks and nodes, and read tray and chassis location data."

[categories.firmware-inventory]
title = "Firmware Inventory"
summary = "Read installed firmware versions and compare them with a firmware manifest."

[categories.firmware-objects]
title = "Firmware Object Catalog"
summary = "Store, list, and manage firmware objects, and read their apply history."

[categories.firmware-updates]
title = "Firmware Updates"
summary = "Start firmware updates on one node, many nodes, or from a firmware object."

[categories.switch-management]
title = "Switch Management"
summary = "Manage switch firmware and NVOS system images, passwords, factory reset, and attestation."

[categories.scale-up-fabric]
title = "Scale-Up Fabric"
summary = "Configure and inspect the scale-up fabric manager on switches."

[categories.switch-tls]
title = "Switch TLS and Certificates"
summary = "Install switch mTLS certificates and disable switch mTLS."

[categories.validation]
title = "System Validation"
summary = "Start NVSSVT system validation scans on nodes."

[categories.utility-jobs]
title = "Utility and Jobs"
summary = "Read the server version and poll asynchronous jobs."

[rpcs."RackManager/SetPowerState"]
category = "power-control"
execution = "sync"
target = "registered"
operations_page = "operations/power-control.md"
client_command = "power <rack_id> <node_id> <operation>"
[rpcs."RackManager/SetPowerState".grpc_errors]
INVALID_ARGUMENT = "The `operation` value is not a valid `PowerOperation`."

[rpcs."RackManager/BatchSetPowerState"]
category = "power-control"
execution = "sync"
target = "ephemeral"
operations_page = "operations/power-control.md"
client_command = "batch_set_power_state <nodes.csv> <operation>"
[rpcs."RackManager/BatchSetPowerState".grpc_errors]
INVALID_ARGUMENT = "The `operation` value is not a valid `PowerOperation`."

[rpcs."RackManager/GetPowerState"]
category = "power-control"
execution = "sync"
target = "registered"
operations_page = "operations/power-control.md"
client_command = "status <rack_id> <node_id>"

[rpcs."RackManager/BatchGetPowerState"]
