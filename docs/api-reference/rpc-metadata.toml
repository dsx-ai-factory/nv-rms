client_command = "batch_get_power_state <nodes.csv>"

[rpcs."RackManager/ExecuteColdReboot"]
category = "power-control"
operations_page = "operations/power-control.md"
summary = "Run the full rack cold reboot sequence on caller-supplied nodes as one asynchronous job."
execution = "async-job"
target = "ephemeral"
poll_with = "GetJobStatus"
result_json = "the full per-stage timeline of the reboot sequence, written on completion or failure"
note = "The sequence stops at the first failed stage and does not roll back. The response `job_id` identifies the coordinator job."

