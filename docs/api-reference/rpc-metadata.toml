target = "ephemeral"
poll_with = "GetJobStatus"
operations_page = "operations/switch-management.md"
note = "The per-node results in the response report job admission only. Poll the jobs to learn whether each password change succeeded. The request sets only the new password for `username` and takes no current password. RMS reaches each switch with the credentials in that node's endpoint, and those credentials can belong to a different user than `username`. On a retry, RMS probes `password` to detect an earlier partial success."

