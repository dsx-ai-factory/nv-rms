<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="858" height="468" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- northbound label -->
  <text x="430" y="30" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#76B900">NORTHBOUND — INCOMING</text>

  <!-- gRPC clients -->
  <rect x="280" y="44" width="300" height="46" rx="6" fill="#eef2f7" stroke="#5b6b7f"/>
  <text x="430" y="72" text-anchor="middle" font-size="13" fill="#1a1a1a">gRPC clients — operators, control planes</text>

  <!-- clients -> RMS -->
  <line x1="430" y1="90" x2="430" y2="146" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="442" y="122" font-size="11" fill="#444">gRPC over mTLS · TLS 1.3 · :8801</text>

  <!-- RMS -->
  <rect x="215" y="150" width="430" height="72" rx="8" fill="#eaf7d6" stroke="#76B900" stroke-width="2"/>
  <text x="430" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Rack Management Service</text>
  <text x="430" y="202" text-anchor="middle" font-size="12" fill="#3a3a3a">RackManager gRPC service   ·   Prometheus /metrics :8802</text>

  <!-- RMS -> targets -->
  <line x1="330" y1="222" x2="160" y2="296" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="222" x2="430" y2="296" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="222" x2="700" y2="296" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#444">Redfish / HTTPS</text>
  <text x="430" y="250" text-anchor="middle" font-size="11" fill="#444">NVUE REST · SSH · SFTP</text>
  <text x="430" y="264" text-anchor="middle" font-size="11" fill="#444">NMX-C gRPC · gNMI</text>
  <text x="710" y="262" text-anchor="middle" font-size="11" fill="#444">Redfish / HTTPS</text>

  <!-- target boxes -->
  <rect x="50" y="300" width="220" height="80" rx="6" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="160" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Compute tray BMC</text>
  <text x="160" y="354" text-anchor="middle" font-size="11" fill="#555">power · device info · firmware</text>

  <rect x="320" y="300" width="220" height="80" rx="6" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="430" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">NVSwitch tray</text>
  <text x="430" y="354" text-anchor="middle" font-size="11" fill="#555">firmware · images · certs · fabric mgr</text>

  <rect x="590" y="300" width="220" height="80" rx="6" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="700" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Power shelf controller</text>
  <text x="700" y="354" text-anchor="middle" font-size="11" fill="#555">power · device info · firmware</text>

  <!-- southbound label -->
  <text x="430" y="418" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#76B900">SOUTHBOUND — OUTGOING</text>
</svg>
