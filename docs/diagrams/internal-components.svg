<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="598" rx="12" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- 1. api/grpc -->
  <rect x="60" y="30" width="740" height="66" rx="8" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="430" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">api/grpc — gRPC gateway (tonic)</text>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#555">power · inventory · firmware · switch · switch-image · cert/security · fabric-manager   ·   conversions (proto ⇄ domain)</text>

  <line x1="430" y1="96" x2="430" y2="136" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. orchestrator -->
  <rect x="60" y="140" width="740" height="66" rx="8" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="430" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">orchestrator — RackManager (rack map + dispatch)</text>
  <text x="430" y="190" text-anchor="middle" font-size="11" fill="#555">JobTracker + job_lifecycle (registry · supervisor · cleanup)   ·   stage_timeline</text>

  <line x1="430" y1="206" x2="250" y2="246" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="206" x2="610" y2="246" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. racks + persistence -->
  <rect x="60" y="250" width="350" height="66" rx="8" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="235" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">racks — trait Rack</text>
  <text x="235" y="300" text-anchor="middle" font-size="11" fill="#555">NvlGb200Rack · NvlGb300Rack · NvlVrnvl72Rack</text>

  <rect x="450" y="250" width="350" height="66" rx="8" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="625" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">persistence — Backends</text>
  <text x="625" y="300" text-anchor="middle" font-size="11" fill="#555">FirmwareObjectStore:  memory  |  postgres (sqlx + migrations)</text>

  <line x1="235" y1="316" x2="415" y2="356" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 4. nodes -->
  <rect x="60" y="360" width="740" height="66" rx="8" fill="#f7f7f7" stroke="#7a7a7a"/>
  <text x="430" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">nodes — trait Node</text>
  <text x="430" y="410" text-anchor="middle" font-size="11" fill="#555">Compute (Redfish) · Powershelf (Redfish) · Switch (NVUE/SSH)   ·   nvfwupd_adapter</text>

  <line x1="430" y1="426" x2="430" y2="466" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5. transport & crates -->
  <rect x="60" y="470" width="740" height="66" rx="8" fill="#f7fbef" stroke="#76B900" stroke-width="1.6"/>
  <text x="430" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">transport &amp; protocol crates</text>
  <text x="430" y="520" text-anchor="middle" font-size="11" fill="#555">http_client (reqwest) · ssh_client (russh/SFTP) · redfish_client · nvue_client · nvfwupd · libnmxc · libgnmi</text>

  <!-- 6. cross-cutting -->
  <rect x="60" y="556" width="740" height="34" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-dasharray="4 3"/>
  <text x="430" y="578" text-anchor="middle" font-size="12" fill="#3a3a3a">cross-cutting:   config (TOML)   ·   logging (logfmt)   ·   metrics (Prometheus)</text>
</svg>
