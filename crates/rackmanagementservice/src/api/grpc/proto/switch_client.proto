syntax = "proto3";

package switch_client;

/*********************************
* NMX CONTROL INTERNAL MESSAGES *
*********************************/

// Internal command/response messages for NMX configuration
// These are used internally by ConfigureNmxc and should not be exposed to external clients

message GetNmxStaticConfigCommand {
  string switch_host = 1;
  int32 port = 2;  // Default: 9370
  string config_file_name = 3;  // Config file to fetch: "fm_config" or "sm_config"
  string key = 4;  // Specific config key to fetch (e.g., "MNNVL_TOPOLOGY") - uses ConfigKeys approach
  // Note: Currently hardcoded to request "MNNVL_TOPOLOGY" key from the specified config file
}

message SetNmxStaticConfigCommand {
  string switch_host = 1;
  string hardware_platform = 2;
  int32 port = 3;  // Default: 9370
}

message GetNmxStaticConfigResponse {
  bytes config_data = 1;       // Raw protobuf response from switch
  string message = 2;          // Status message
}

message SetNmxStaticConfigResponse {
  string message = 1;          // Status message
  string topology_used = 2;    // The topology that was applied
}

/*********************************
* NMX SWITCH PROTOBUF MESSAGES *
* (For calling NMX Controller service) *
*********************************/

// Message definitions for calling the external NMX switch gRPC service
// These match the nmx_c.NMX_Controller service message structure

message NmxContext {
  string context = 1;
}

// Request message for calling NMX_Controller/Hello (initialization)
// Enum for major version (from NMX API)
enum ProtoMsgMajorVersion {
  PROTO_MSG_MAJOR_VERSION_UNDEFINED = 0;
  PROTO_MSG_MAJOR_VERSION_OBSOLETE1 = 1;
  PROTO_MSG_MAJOR_VERSION = 2;
}

// Enum for minor version (from NMX API)
enum ProtoMsgMinorVersion {
  PROTO_MSG_MINOR_VERSION_UNDEFINED = 0;
  PROTO_MSG_MINOR_VERSION_OBSOLETE1 = 1;
  PROTO_MSG_MINOR_VERSION_OBSOLETE2 = 2;
  PROTO_MSG_MINOR_VERSION_OBSOLETE3 = 3;
  PROTO_MSG_MINOR_VERSION_OBSOLETE4 = 4;
  PROTO_MSG_MINOR_VERSION = 5;
}

message NmxHelloRequest {
  string gatewayId = 1;
  ProtoMsgMajorVersion major_version = 2;  // Should be enum value 2
  ProtoMsgMinorVersion minor_version = 3;  // Should be enum value 5
}

// Response message for parsing NMX_Controller/Hello response
message NmxHelloResponse {
  NmxServerHeader serverHeader = 1;
}

message NmxReturnCode {
  NmxServerHeader serverHeader = 1;
}

// Message for requesting specific config keys
message NmxConfigKey {
  string configFileName = 1;  // e.g., "fm_config"
  string key = 2;             // e.g., "MNNVL_TOPOLOGY"
}

message NmxConfigKeys {
  repeated NmxConfigKey configKey = 1;
}

// Message for requesting complete config files
message NmxConfigFile {
  string configFileName = 1;  // e.g., "fm_config"
}

message NmxConfigFiles {
  repeated NmxConfigFile configFile = 1;
}

// Request message for calling NMX_Controller/GetStaticConfig
message NmxGetStaticConfigRequest {
  NmxContext context = 1;
  NmxConfigKeys configKeys = 2;  // Request specific key-value pairs
  NmxConfigFiles configFiles = 3;  // Request complete config files
  string gatewayId = 4;
}

// Message definitions for calling NMX_Controller/SetStaticConfig
message NmxConfigKeyVal {
  string configFileName = 1;  // e.g., "fm_config"
  string key = 2;             // e.g., "MNNVL_TOPOLOGY"
  string value = 3;           // e.g., "gb200_nvl36r1_c2g4_topology" (changed from 'val' to match NMX API)
}

message NmxConfigKeyVals {
  repeated NmxConfigKeyVal configKeyVal = 1;
}

message NmxConfigFileContent {
  string configFileName = 1;
  string configFileContent = 2;
}

message NmxConfigFileContents {
  repeated NmxConfigFileContent configFileContent = 1;
}

// Request message for calling NMX_Controller/SetStaticConfig
message NmxSetStaticConfigRequest {
  string gatewayId = 1;
  NmxStaticConfig staticConfig = 2;
}

// Response message structures for parsing NMX switch responses
// NMX Controller return code enum
enum ST_ReturnCode {
  NMX_ST_UNDEFINED = 0;
  NMX_ST_SUCCESS = 1;
  NMX_ST_BADPARAM = 2;
  NMX_ST_GENERIC_ERROR = 3;
  NMX_ST_NOT_SUPPORTED = 4;
  NMX_ST_UNINITIALIZED = 5;
  NMX_ST_TIMEOUT = 6;
  NMX_ST_INTERNAL_ERROR = 7;
  NMX_ST_IN_USE = 8;
  NMX_ST_NOT_CONFIGURED = 9;
  NMX_ST_CONNECTION_NOT_VALID = 10;
}

message NmxServerHeader {
  string domain_uuid = 1;
  string app_uuid = 2;
  string app_ver = 3;
  ST_ReturnCode returnCode = 4;  // NMX Controller return code enum (NMX_ST_SUCCESS = 1)
}

// Static config returned as either key-value pairs or complete file contents
message NmxStaticConfig {
  NmxContext context = 1;
  NmxConfigKeyVals configKeyVals = 2;
  NmxConfigFileContents configFileContents = 3;
}

// Response message for parsing NMX_Controller/GetStaticConfig response
// Note: NMX switch may return data in different formats, so we support multiple field structures
message NmxGetStaticConfigResponse {
  NmxServerHeader serverHeader = 1;
  NmxStaticConfig staticConfig = 2;
  NmxConfigKeyVals configKeyVals = 4;  // Compatibility with responses that return values directly
}

// Observation fields and enum values retain the NMX_Controller wire numbers.
// Fields outside the health and membership observation subset are omitted.
enum ControlPlaneState {
  NMX_CONTROL_PLANE_STATE_UNDEFINED = 0;
  NMX_CONTROL_PLANE_STATE_OFFLINE = 1;
  NMX_CONTROL_PLANE_STATE_STANDBY = 2;
  NMX_CONTROL_PLANE_STATE_CONFIGURED = 3;
  NMX_CONTROL_PLANE_STATE_TIMEOUT = 4;
  NMX_CONTROL_PLANE_STATE_ERROR = 5;
  NMX_CONTROL_PLANE_STATE_UNCONFIGURED = 6;
  NMX_CONTROL_PLANE_STATE_DEGRADED = 7;
}

enum NmxControllerHealth {
  NMX_CONTROLLER_HEALTH_UNKNOWN = 0;
  NMX_CONTROLLER_HEALTH_HEALTHY = 1;
  NMX_CONTROLLER_HEALTH_DEGRADED = 2;
  NMX_CONTROLLER_HEALTH_UNHEALTHY = 3;
  NMX_CONTROLLER_HEALTH_UNHEALTHY_DB_CORRUPTED = 4;
}

enum ComputeNodeHealth {
  NMX_COMPUTE_NODE_HEALTH_UNKNOWN = 0;
  NMX_COMPUTE_NODE_HEALTH_HEALTHY = 1;
  NMX_COMPUTE_NODE_HEALTH_DEGRADED = 2;
  NMX_COMPUTE_NODE_HEALTH_UNHEALTHY = 3;
}

enum SwitchNodeHealth {
  NMX_SWITCH_NODE_HEALTH_UNKNOWN = 0;
  NMX_SWITCH_NODE_HEALTH_HEALTHY = 1;
  NMX_SWITCH_NODE_HEALTH_MISSING_NVLINK = 2;
  NMX_SWITCH_NODE_HEALTH_UNHEALTHY = 3;
}

enum SwitchHealth {
  NMX_SWITCH_HEALTH_UNKNOWN = 0;
  NMX_SWITCH_HEALTH_HEALTHY = 1;
  NMX_SWITCH_HEALTH_MISSING_NVLINK = 2;
  NMX_SWITCH_HEALTH_UNHEALTHY = 3;
}

enum GpuHealth {
  NMX_GPU_HEALTH_UNKNOWN = 0;
  NMX_GPU_HEALTH_HEALTHY = 1;
  NMX_GPU_HEALTH_DEGRADED = 2;
  NMX_GPU_HEALTH_NO_NVLINK = 3;
  NMX_GPU_HEALTH_DEGRADED_BW = 4;
}

enum PortType {
  NMX_PORT_TYPE_UNDEFINED = 0;
  NMX_PORT_TYPE_GPU = 1;
  NMX_PORT_TYPE_SWITCH_ACCESS = 2;
  NMX_PORT_TYPE_SWITCH_TRUNK = 3;
  NMX_PORT_TYPE_FNM = 4;
  NMX_PORT_TYPE_HCA = 5;
}

enum LogicalLinkState {
  NMX_LOGICAL_LINK_NO_CHANGE = 0;
  NMX_LOGICAL_LINK_STATE_DOWN = 1;
  NMX_LOGICAL_LINK_STATE_INIT = 2;
  NMX_LOGICAL_LINK_STATE_ARMED = 3;
  NMX_LOGICAL_LINK_STATE_ACTIVE = 4;
  NMX_LOGICAL_LINK_STATE_ACT_DEFER = 5;
}

enum PhysicalPortState {
  NMX_PORT_PHYS_STATE_NO_CHANGE = 0;
  NMX_PORT_PHYS_STATE_SLEEP = 1;
  NMX_PORT_PHYS_STATE_POLLING = 2;
  NMX_PORT_PHYS_STATE_DISABLED = 3;
  NMX_PORT_PHYS_STATE_PORTCONFTRAIN = 4;
  NMX_PORT_PHYS_STATE_LINKUP = 5;
  NMX_PORT_PHYS_STATE_LINKERRRECOVER = 6;
  NMX_PORT_PHYS_STATE_PHYTEST = 7;
}

enum AdminState {
  NMX_ADMIN_STATE_UNKNOWN = 0;
  NMX_ADMIN_STATE_UP = 1;
  NMX_ADMIN_STATE_DOWN = 2;
  NMX_ADMIN_STATE_DIAG = 3;
}

message NmxGetDomainStateInfoRequest {
  NmxContext context = 1;
  string gateway_id = 2;
}

message NmxDomainStateInfo {
  NmxServerHeader server_header = 1;
  NmxContext context = 2;
  ControlPlaneState control_plane_state = 3;
  NmxControllerHealth nmx_controller_health = 6;
}

message NmxLocation {
  uint64 chassis_id = 1;
  uint64 slot_id = 2;
  uint64 host_id = 3;
}

message NmxLocationInfo {
  string chassis_serial_number = 2;
  uint64 tray_index = 4;
  NmxLocation location = 6;
}

message NmxGetSwitchNodeInfoListRequest {
  NmxContext context = 1;
  repeated NmxLocation loc_list = 2;
  string gateway_id = 3;
}

message NmxSwitchNodeInfo {
  NmxLocationInfo loc = 1;
  uint32 num_switches = 2;
  SwitchNodeHealth node_health = 3;
}

message NmxGetSwitchNodeInfoListResponse {
  NmxServerHeader server_header = 1;
  NmxContext context = 2;
  repeated NmxSwitchNodeInfo node_info_list = 3;
}

message NmxGetComputeNodeInfoListRequest {
  NmxContext context = 1;
  repeated NmxLocation loc_list = 2;
  string gateway_id = 3;
}

message NmxComputeNodeInfo {
  NmxLocationInfo loc = 1;
  uint32 num_gpus = 2;
  ComputeNodeHealth node_health = 3;
}

message NmxGetComputeNodeInfoListResponse {
  NmxServerHeader server_header = 1;
  NmxContext context = 2;
  repeated NmxComputeNodeInfo node_info_list = 3;
}

message NmxGetTopologyInfoRequest {
  NmxContext context = 1;
  string gateway_id = 3;
}

message NmxPortTopoInfo {
  PortType port_type = 1;
  uint64 port_uid = 2;
  uint64 port_num = 3;
  uint64 peer_port_device_uid = 4;
  uint64 peer_port_num = 5;
  PhysicalPortState physical_state = 6;
  LogicalLinkState logical_state = 7;
  AdminState port_admin_state = 31;
}

message NmxSwitchTopoInfo {
  NmxLocationInfo loc = 1;
  uint64 device_uid = 3;
  uint64 num_ports = 5;
  uint64 system_uid = 6;
  SwitchHealth device_health = 11;
  repeated NmxPortTopoInfo port_topo_info = 12;
}

message NmxGpuTopoInfo {
  NmxLocationInfo loc = 1;
  uint64 device_uid = 3;
  uint64 num_ports = 5;
  uint64 system_uid = 6;
  GpuHealth device_health = 13;
  repeated NmxPortTopoInfo port_topo_info = 14;
}

message NmxDeviceTopoInfo {
  oneof device {
    NmxSwitchTopoInfo switch_topo_info = 1;
    NmxGpuTopoInfo gpu_topo_info = 2;
  }
}

message NmxFmTopologyInfo {
  NmxServerHeader server_header = 1;
  NmxContext context = 2;
  repeated NmxDeviceTopoInfo device_topo_info = 3;
}
