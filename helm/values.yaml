# Default values for the rack-manager Helm chart.
#
# Default layout: external PostgreSQL (databaseMode: external) with optional
# rmsPostgres helpers (ESO credential sync, cluster patch). Does not deploy
# in-cluster Postgres (postgres.enabled: false).
#
# Database modes (set databaseMode; override in a site-specific values file):
#   external   — use an existing cluster (default here). Set database.host,
#     database.name, database.credentialsSecret, and rmsPostgres.* to match your
#     cluster name, namespace, and operator secret naming.
#   standalone — chart-managed Postgres. Set databaseMode: standalone,
#     postgres.enabled: true, and postgres.auth (or postgres.auth.existingSecret).
#   memory     — no database; in-memory persistence only. No credentials secret,
#     database ConfigMap, or drop-database hook are created. Data is lost on
#     restart — for development and testing only.
#
# Overrides: keep this file as the base; layer environment-specific settings with
# -f (later files win). Example:
#   helm upgrade --install rack ./helm \
#     -f helm/values.yaml \
#     -f helm/my-site-values.yaml \
#     --set global.image.tag=<APP_TAG> \
#     -n rack-manager --create-namespace
#
# Example my-site-values.yaml (external DB on a non-default cluster):
#   database:
#     host: my-pg-cluster.postgres.svc.cluster.local
#     name: my_rms_db
#     credentialsSecret: rms-api-server.rack-manager.my-pg-cluster.credentials
#   rmsPostgres:
#     externalSecret:
#       enabled: true
#       sourceSecretKey: rms-api-server.rack-manager.my-pg-cluster.credentials.postgresql.acid.zalan.do
#     patchExternalCluster:
#       enabled: true
#       postgresqlName: my-pg-cluster
#       databaseName: my_rms_db
#
# Example values-local-dev.yaml (development only — plaintext gRPC, no mTLS):
#   apiServer:
#     environmentPath: local-dev
#     allowInsecure: true
#     tls:
#       enabled: false
#   See helm/README.md "Insecure Mode" for when and how to use this override.
#
# Chart version (Chart.yaml `version`) tracks packaging changes only.
# Application images are selected independently via global.image.tag at install/upgrade.
#
# Prerequisites (external DB mode):
#   - PostgreSQL cluster reachable at database.host
#   - DB/user provisioned on the target cluster
#   - DB credentials via ESO (rmsPostgres.externalSecret) or pre-created database.credentialsSecret

nameOverride: ""
fullnameOverride: ""

namespace: rack-manager
createNamespace: false

# Shared defaults for the RMS API server image.
global:
  image:
    # Required at install unless apiServer.image.tag is set,
    # or the chart was packaged with a non-empty appVersion.
    tag: ""
    pullPolicy: Always
  imagePullSecrets: []

# Database backend selection. Prefer external when a shared cluster already
# exists; use standalone only for dev or when the chart should run its own Postgres.
databaseMode: external

# Run a pre-delete hook to drop the release database when uninstalling (external/standalone).
# Set to false to keep the database on helm uninstall.
dropDatabaseOnUninstall: true

# NVSSVT system validation scanner (nvssvt_server.py launcher API).
#
# Runs as a second container in the API server pod rather than as its own
# Deployment: containers in a pod share a network namespace, so RMS reaches the
# launcher on 127.0.0.1 with no Service, DNS, or cross-pod networking, and the
# two are scheduled, scaled, and restarted as one unit.
#
# Disabled by default because the image is site-specific -- an install that
# does not set `image.repository` would otherwise get a pod stuck on
# ImagePullBackOff. With it disabled, RMS starts normally and only
# StartSystemValidation is affected: each node's scan fails to launch with an
# unreachable-launcher error, reported in that node's NodeOperationResult
# rather than failing the call itself (nothing is listening on 127.0.0.1:8000).
nvssvt:
  enabled: false
  image:
    repository: nvssvt-server
    tag: latest
    # Defaults to IfNotPresent rather than global.image.pullPolicy: the NVSSVT
    # image is versioned independently of RMS, and a locally built/loaded tag
    # must not be re-pulled from a registry.
    pullPolicy: IfNotPresent
  resources: {}

apiServer:
  enabled: true
  image:
    repository: nvcr.io/0837451325059433/rms-dev/rms-api
    pullPolicy: ""
  replicaCount: 1
  # Covers RMS's five-minute job drain plus trace flush and scheduling margin.
  terminationGracePeriodSeconds: 330
  # Extra RMS Pod annotations, such as sidecar.opentelemetry.io/inject to have
  # the OpenTelemetry Operator add a sidecar Collector. Values must be strings.
  podAnnotations: {}
  port: 8801
  metrics:
    # Dedicated Prometheus /metrics listener port (independent of gRPC API port).
    port: 8802
    tls:
      # When true, config.toml sets [metrics] tls = true and /metrics is served over
      # standard TLS using the API server certificate (no client certificate required).
      enabled: false
  # Existing PersistentVolumeClaim for firmware artifacts. Leave empty (or omit) to
  # use firmwareStoragePath hostPath; set a valid PVC name in a site override
  # passed with -f.
  firmwarePersistentVolumeClaim: ""
  # Host directory on the node (hostPath volume source).
  firmwareStoragePath: /mnt/data
  # In-container mount for firmware artifacts; rendered into config.toml as
  # [workflows] firmware_dir.
  firmwareMountPath: /mnt/firmware
  # Deprecated / no-op: RMS no longer consumes ENVIRONMENT_PATH. Retained only so
  # existing overrides that still set it do not fail. Safe to omit.
  environmentPath: local-dev
  # When true, config.toml sets [tls] insecure = true and the Deployment injects the
  # RMS_ALLOW_INSECURE=1 environment gate. RMS requires both before it will bind
  # plaintext gRPC (defense-in-depth so a stale ConfigMap alone cannot downgrade
  # the API). Dev/test only: plaintext gRPC with no client authentication.
  # Production MUST keep this false and enable apiServer.tls with a client CA (mTLS).
  allowInsecure: false
  # gateway_id sent on NMX-C gRPC requests from RMS (config.toml [switches] nmx_gateway_id).
  nmxGatewayId: rack-manager-grpc-client
  # Maximum size of the Postgres connection pool (config.toml [postgres] db_pool_max). Must be > 0.
  dbPoolMax: 20
  # Maximum number of async job records the tracker retains (config.toml [workflows] max_tracked_jobs).
  maxTrackedJobs: 10000
  # Retention period for completed and failed job records, in seconds
  # (config.toml [workflows] terminal_job_ttl_seconds).
  terminalJobTtlSeconds: 86400
  # Opaque deployment-defined profile identifiers mapped to NVFWUPD AP names
  # and, optionally, expected physical Flint device counts.
  # Nodes select one with NodeDescriptor.attributes["inventory_profile"].
  expectedInventoryProfiles: {}
  #  gb200-compute-variant-a:
  #    - FW_BMC_0
  #    - HGX_FW_GPU_0
  #  vrnvl72-compute:
  #    - FW_BMC_0
  #    - HGX_FW_BMC_0
  #    - HGX_FW_GPU_0
  #  sku-gb200:
  #    apNames: [FW_BMC_0, HGX_FW_GPU_0]
  #    flintDevices:
  #      cx7: 4
  #      cx8: 0
  #      bf3Nic: 2
  # Optional log level / filter directive, replacing RUST_LOG (config.toml [logging] log_level).
  # Leave empty to use the default `info` level plus dependency caps.
  logLevel: ""
  # Assuming a logging collector is adding its own timestamps, so this is disabled by default to
  # prevent duplicate timestamp fields. If no logging collector is being used, set true to output
  # timestamps natively (config.toml [logging] enable_timestamps).
  enableTimestamps: false
  # Backend-neutral OpenTelemetry trace export. RMS always creates real
  # trace/span IDs for approved spans; setting endpoint enables OTLP export.
  tracing:
    # HTTPS is required, with a Collector certificate trusted by RMS, except for
    # a Collector on a loopback IP address such as a sidecar: http://127.0.0.1:4317
    # gRPC: https://collector.example:4317
    # HTTP/protobuf: https://collector.example:4318/v1/traces
    endpoint: ""
    # grpc or http_protobuf; both use TLS unless the endpoint is a loopback IP.
    protocol: grpc
    samplingRatio: 1.0
    maxQueueSize: 2048
    maxExportBatchSize: 512
    scheduledDelayMs: 5000
    exportAttemptTimeoutMs: 10000
    exportTimeoutMs: 30000
    shutdownTimeoutMs: 5000
    maxRetries: 3
    retryInitialDelayMs: 100
    retryMaxDelayMs: 1600
    retryJitterMs: 100
  # When false (default), outbound switch connectivity uses mTLS over HTTPS for nvue_api,
  # gRPC over HTTPS for scale_up_fabric_manager, and mTLS for secure-only gNMI checks.
  # Requires clientTlsCertificates and defaultSwitchDomain.
  # When true, config.toml sets [switches] insecure_switch = true: nvue_api remains HTTPS
  # without client mTLS or server verification, scale_up_fabric_manager uses plaintext
  # HTTP, and direct gNMI connectivity checks are skipped.
  insecureSwitch: false
  # When true (historical default), config.toml sets [bmc] insecure_bmc = true:
  # RMS skips BMC/Redfish HTTPS server certificate verification because BMC
  # certificates are typically self-signed. Set false after BMC certificates
  # are issued by a CA the RMS process trusts.
  insecureBmc: true
  # Overall wall-clock timeout (seconds) for switch NVOS SFTP image uploads.
  sftpUploadTimeoutSeconds: 3600
  # Stall timeout (seconds) for one SFTP setup/read/write/flush step during
  # switch NVOS image uploads. Must be <= sftpUploadTimeoutSeconds.
  sftpStepTimeoutSeconds: 30
  # Upper bound (seconds) on polling one firmware task for completion. Covers
  # the slowest component, since one loop serves every firmware task.
  firmwareTaskTimeoutSeconds: 10800
  # Wait after ONIE starts installing until NVOS SSH is ready.
  onieRecoveryTimeoutSeconds: 900
  # Wait for NVUE to save recovered credentials after boot.
  recoveredCredentialSaveTimeoutSeconds: 300
  # Delay (seconds) between polls of an in-flight firmware task. Must be <=
  # firmwareTaskTimeoutSeconds. Each poll emits one log line, so lower values
  # make a running firmware update noisier.
  firmwareTaskPollIntervalSeconds: 30
  # How long (seconds) to tolerate consecutive firmware task-status read
  # failures before failing the update. Reset by any successful read.
  # On Supermicro GB300 BMC targets the task legitimately disappears mid-flash,
  # so this window doubles as the grace period before RMS falls back to
  # verifying the installed version. Setting it far below the flash duration
  # verifies against pre-update firmware and reports a version mismatch.
  firmwareTaskTransientErrorTimeoutSeconds: 900
  # How long (seconds) a compute firmware update waits for the tray to report
  # power On after the power-on that opens the flow. The default, one minute,
  # is the VR NVL72 bound for this power-on, and GB200 and GB300 use it too.
  # The power-on step arrives in a following change. Until it lands, RMS
  # validates and stores both values and nothing reads them.
  computePowerOnTimeoutSeconds: 60
  # Delay (seconds) between power-state reads during that wait. Must be <=
  # computePowerOnTimeoutSeconds.
  computePowerOnPollIntervalSeconds: 5
  # When true, HTTP(S) firmware artifacts must include a SHA-256 digest
  # (config.toml [workflows] artifact_require_sha256). Default false.
  # See docs/configuration/configuring-rms.md#artifact-download-policy.
  artifactRequireSha256: false
  # HTTP(S) firmware-object download policy. Defaults are unrestricted.
  # To enable: populate artifactHttpsHosts and/or set
  # artifactAllowPrivateTargets false.
  # See docs/configuration/configuring-rms.md#artifact-download-policy.
  # Hostname or *.suffix allow-list (*.suffix matches the suffix and its
  # subdomains; config.toml [workflows] artifact_https_hosts).
  artifactHttpsHosts: []
  # When false, reject loopback/private/link-local HTTP(S) targets including redirects.
  artifactAllowPrivateTargets: true

  # Switch-side cert material to install on switches. Each entry mounts a secret at
  # {switchCertRoot}/{domain}/ (ca.pem, client.pem, client.key).
  switchCertRoot: /var/run/secrets/switch-cert
  switchCertCertificates: []
  #  - domain: site-wide
  #    secret: rms-switch-cert-material
  # RMS client mTLS for outbound switch nvue_api, scale_up_fabric_manager, and
  # secure certificate-install connectivity checks. Required unless
  # apiServer.insecureSwitch is true. Each entry mounts a cert-manager secret at
  # {clientTlsRoot}/{domain}/ (ca.pem, client.pem, client.key).
  clientTlsRoot: /var/run/secrets/client-tls
  clientTlsCertificates: []
  #  - domain: site-wide
  #    secret: rms-nmxc-client-certificate
  #  - domain: myrack.example.com
  #    secret: rms-nmxc-client-certificate-myrack
  # Default domain when switch RPCs omit domain; rendered as config.toml
  # [switches] default_switch_domain. Set in site-specific overrides when
  # switchCertCertificates / clientTlsCertificates are configured.
  defaultSwitchDomain: ""
  # Optional DNS domain used for switch NVUE, scale_up_fabric_manager, and secure-only
  # gNMI TLS server-name verification (config.toml [switches] dns_domain).
  dnsDomain: ""

  tls:
    enabled: true
    # Directory where the API server TLS secret is mounted (tls.crt, tls.key, ca.crt).
    secretMountPath: /var/run/secrets/rms-api
    # Use an existing secret name (containing tls.crt/tls.key and optional ca.crt)
    existingSecret: ""
    # Provide file contents via --set-file apiServer.tls.cert=... and apiServer.tls.key=...
    cert: ""
    key: ""
    # Client CA for mTLS; required by the RMS binary whenever TLS is enabled.
    caEnabled: true
    ca: ""
    # How often the API server re-reads tls.crt and tls.key, in seconds.
    # New handshakes use a renewed leaf within one interval. The client CA
    # is still read only at startup. Must be greater than 0.
    certReloadIntervalSeconds: 300
  # ServiceMonitor for the metrics endpoint on the dedicated metrics port
  serviceMonitor:
    enabled: true
    # Prometheus instance name: Must match the serviceMonitorSelector label
    # on your Prometheus CR, unless you use a nil selector (picks up all ServiceMonitors).
    prometheus: ""
    # TLS configuration used when apiServer.metrics.tls.enabled is true.
    # prometheus-operator v0.50+ resolves secrets from the ServiceMonitor's own namespace.
    tlsConfig:
      # insecureSkipVerify: Skip all server cert verification (traffic still encrypted).
      #   Use only in dev/test environments.
      insecureSkipVerify: false
      # serverName: Override the hostname used for TLS SNI and cert verification.
      #   Required when Prometheus scrapes by pod IP (the default) and the cert has no IP SANs.
      #   Set to any DNS SAN on the server cert, e.g. rms-api-server.rack-manager.svc.cluster.local.
      serverName: ""
      # caSecret / caSecretKey: Secret in the ServiceMonitor namespace holding the CA cert.
      #   Used to verify the server certificate chain.
      caSecret: ""
      caSecretKey: ca.crt

# cert-manager Certificates for the API server and switch mTLS material.
# Requires the cert-manager CRDs and a reachable issuer, so this is opt-in: set
# certificates.enabled: true and certificates.issuerRef.name in a site override.
#
# When enabled, the chart issues:
#   - the API server certificate, mounted in place of apiServer.tls.existingSecret
#   - one certificate per apiServer.switchCertCertificates entry (switch-side server certs)
#   - one certificate per apiServer.clientTlsCertificates entry (RMS-side switch client certs)
# The Certificate is named after, and writes to, the secret each entry already
# references, so no secret name is repeated.
#
# Renewal only rewrites the Secret. The API server re-reads its leaf cert and
# key on tls.certReloadIntervalSeconds; the client CA and switch server
# material are not picked up automatically. See "Rotation and renewal" in
# helm/README.md before shortening the lifetimes below.
certificates:
  enabled: false
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  # Set these to match how often the site actually redistributes the material:
  # a certificate expires on this schedule whether or not anyone re-pushed it.
  duration: 720h0m0s
  renewBefore: 360h0m0s
  privateKey:
    algorithm: ECDSA
    size: 384
    # Explicit because cert-manager changed this default from Never to Always in
    # v1.18; unset, the site's cert-manager version decides whether a renewal
    # mints a new key.
    rotationPolicy: Always
  spiffe:
    trustDomain: ""
    path: rack-manager/sa/rms-api-server
  labels: {}
  annotations: {}
  apiServer:
    enabled: true
    # Defaults to apiServer.tls.existingSecret, then rms-api-server-certificate.
    secretName: ""
    dnsNames: []
  switchServer:
    enabled: true
    privateKey:
      algorithm: ECDSA
      size: 256
    # NVOS switches consume the combined key+cert PEM written by this format.
    additionalOutputFormats:
      - CombinedPEM
    # Defaults to apiServer.dnsDomain, which RMS uses verbatim as the switch TLS
    # authority. Set here (or per entry) only for a switch domain that differs.
    dnsNames: []
  switchClient:
    enabled: true
    usages:
      - client auth
      - digital signature

# External PostgreSQL connection (used when databaseMode is external).
# Placeholder defaults below — override database.host, database.name, and
# database.credentialsSecret for your cluster before installing.
database:
  host: my-pg-cluster.postgres.svc.cluster.local
  port: "5432"
  name: my_rms_db
  credentialsSecret: rms-api-server.rack-manager.my-pg-cluster.credentials
  sslMode: require
  # Keys within credentialsSecret holding the username and password. Defaults
  # match the common Zalando naming (username/password). Some operators use
  # different key names — e.g. Crunchy Data (CrunchyData/postgres-operator)
  # publishes the role name under "user" — so these are configurable to let the
  # chart consume an operator-managed secret directly, without a re-mapping step.
  # Consulted whenever the chart consumes a credentials secret it does not write
  # itself: database.credentialsSecret (external database mode, or standalone
  # mode with postgres.enabled: false), or postgres.auth.existingSecret. Only
  # the chart-generated standalone secret always uses username/password; the
  # standalone StatefulSet bootstrap password additionally keeps its historical
  # POSTGRES_PASSWORD key unless the password key is remapped to a non-default
  # name. Key
  # names must satisfy the full Kubernetes Secret key syntax — non-empty, at
  # most 253 characters, matching [-._a-zA-Z0-9]+, and not ".", "..", or
  # ".."-prefixed; anything else fails at render time.
  credentialsSecretKeys:
    username: username
    password: password

# In-cluster Postgres (used only when databaseMode: standalone and postgres.enabled: true).
# Leave enabled: false when using database.host / rmsPostgres above.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: rms
    password: ""
    existingSecret: ""

# Optional helpers for external DB on a Zalando PostgreSQL cluster.
# Disable externalSecret when database.credentialsSecret is pre-created manually.
# Disable the cluster patch job when the DB/user already exist on the target cluster.
rmsPostgres:
  externalSecret:
    enabled: false
    refreshTime: 30s
    refreshInterval: 30s
    deletionPolicy: Retain
    secretStoreRef:
      name: postgres-ns-secretstore
      kind: ClusterSecretStore
    # Required when enabled; see example my-site-values.yaml above.
    sourceSecretKey: ""
    sourceSecretVersion: v1
  # Patch the target PostgreSQL CR to add the RMS database and a LOGIN
  # role that owns it (requires RBAC in the postgres namespace). The role
  # is not SUPERUSER and cannot create databases.
  patchExternalCluster:
    enabled: false
    postgresqlNamespace: postgres
    postgresqlName: my-pg-cluster
    databaseName: my_rms_db
    userName: rms-api-server.rack-manager

grafana:
  dashboard:
    # When true, deploys a ConfigMap containing the RMS Grafana dashboard JSON.
    # The Grafana grafana-sc-dashboard sidecar (included with kube-prometheus-stack)
    # watches for ConfigMaps with the label below and hot-loads them — no Grafana restart required.
    # Requires: Grafana with grafana-sc-dashboard sidecar enabled.
    enabled: true

    # Namespace where Grafana's sidecar is watching for ConfigMaps.
    # Must match the namespace Grafana is deployed in.
    #   - site monitoring stack:     monitoring (or your Prometheus/Grafana namespace)
    #   - kube-prometheus-stack:       monitoring (or whichever namespace you installed it in)
    #   - Leave empty to deploy into the chart's own namespace (rack-manager).
    namespace: ""

    # Label key the grafana-sc-dashboard sidecar watches for.
    # kube-prometheus-stack sets this to "grafana_dashboard" by default.
    label: grafana_dashboard

    # Label value the sidecar requires on the ConfigMap.
    # kube-prometheus-stack expects "1" by default.
    labelValue: "1"

    # Grafana folder the dashboard is placed in.
    # This value is used as a Kubernetes label value — spaces are not allowed.
    # Use alphanumeric characters, hyphens, underscores, or dots only.
    # Leave empty to place the dashboard in the Grafana root (General) folder.
    folder: "RackManagement"

    # UID of the Grafana datasource used by all dashboard panels.
    # Must match the datasource UID configured in Grafana for this site.
    #   - VictoriaMetrics (Prometheus-compatible):  "prom-victoriametrics"
    #   - Plain Prometheus (kube-prometheus-stack):  "prometheus"
    datasourceUid: "prom-victoriametrics"

commonLabels: {}
