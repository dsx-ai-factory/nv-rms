apiVersion: v2
name: rack-manager
description: Helm chart for Rack Management System (RMS) - API server and optional Postgres
type: application
# Chart semver, versioned independently of the RMS application. Use plain
# MAJOR.MINOR.PATCH only — no -rc or -dev suffixes. Bump this line on any change
# to chart package inputs (templates, values.yaml, values.schema.json,
# .helmignore, crds/, charts/); CI fails a chart change that leaves it untouched.
# See helm/README.md "Versioning".
version: 1.0.1
# The RMS app image to run is chosen at install via global.image.tag and is
# decoupled from the chart version. This is only a fallback; CI stamps the
# packaged appVersion via `helm package --app-version`.
appVersion: "0.0.0"
keywords:
  - rack-manager
  - rms
  - dcim
maintainers: []
