suite: API server firmware storage
templates:
  - templates/api-server-deployment.yaml
tests:
  - it: uses hostPath firmware storage by default
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: firmware-storage
            hostPath:
              path: /mnt/data
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: rms-config
            configMap:
              name: rms-api-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: firmware-storage
            mountPath: /mnt/firmware
            readOnly: false
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: rms-config
            mountPath: /etc/rms
            readOnly: true

  - it: uses PVC firmware storage when a claim is configured
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      apiServer.firmwarePersistentVolumeClaim: rms-firmware-downloads
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: firmware-storage
            persistentVolumeClaim:
              claimName: rms-firmware-downloads
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: firmware-storage
            mountPath: /mnt/firmware
            readOnly: false
