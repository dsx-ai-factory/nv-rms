suite: Database credential secret keys
release:
  name: rms
  namespace: rack-manager
templates:
  - templates/api-server-deployment.yaml
  - templates/drop-database-job.yaml
tests:
  - it: defaults external DB secret keys to username/password
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: my-secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: my-secret

  - it: honors configurable external DB secret keys (Crunchy "user")
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: user
      database.credentialsSecretKeys.password: password
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: user
                name: my-secret
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: user
                optional: true

  - it: ignores credentialsSecretKeys for standalone chart-managed Postgres
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.password: secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.username: user
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: rms-rack-manager-postgres-credentials
                key: username
