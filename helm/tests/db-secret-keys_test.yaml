suite: Database credential secret keys
release:
  name: rms
  namespace: rack-manager
templates:
  - templates/api-server-deployment.yaml
  - templates/drop-database-job.yaml
  - templates/postgres.yaml
tests:
  - it: defaults external DB secret keys to username/password
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: username
                name: my-secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: my-secret

  - it: honors configurable external DB secret keys (Crunchy "user"/"pass")
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: user
      database.credentialsSecretKeys.password: pass
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: user
                name: my-secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: pass
                name: my-secret
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: user
                optional: true
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: pass
                optional: true

  - it: quotes secret keys so numeric or boolean-looking names stay strings
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: "123"
      database.credentialsSecretKeys.password: "true"
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: "123"
                name: my-secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: "true"
                name: my-secret
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: "123"
                optional: true
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: "true"
                optional: true

  - it: honors configurable DB secret keys in standalone mode without chart-managed Postgres
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: false
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: user
      database.credentialsSecretKeys.password: pass
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                key: user
                name: my-secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: pass
                name: my-secret
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: user
                optional: true
      - template: templates/drop-database-job.yaml
        documentSelector:
          path: kind
          value: Job
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: pass
                optional: true

  - it: ignores credentialsSecretKeys for standalone chart-managed Postgres
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.password: secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.username: user
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: rms-rack-manager-postgres-credentials
                key: username

  - it: honors credentialsSecretKeys for standalone chart-managed Postgres with an existingSecret
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.existingSecret: crunchy-secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.username: user
      database.credentialsSecretKeys.password: pass
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: crunchy-secret
                key: user
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: crunchy-secret
                key: pass
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                name: crunchy-secret
                key: user
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: crunchy-secret
                key: pass

  - it: fails rendering when a secret key override is empty
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: ""
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.username must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "")'

  - it: fails rendering when a secret key override is not a valid Secret key name
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.password: my password
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.password must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "my password")'

  - it: fails rendering when a secret key override is "."
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: "."
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.username must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got ".")'

  - it: fails rendering when a secret key override is ".."
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.password: ".."
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.password must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "..")'

  - it: fails rendering when a secret key override starts with ".."
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: "..user"
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.username must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "..user")'

  - it: fails rendering when a secret key override exceeds 253 characters
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - template: templates/api-server-deployment.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.username must be no more than 253 characters (got 254)'

  - it: accepts a 253-character secret key override
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - template: templates/api-server-deployment.yaml
        hasDocuments:
          count: 2

  - it: skips secret key validation in memory mode
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: memory
      database.credentialsSecretKeys.username: my user
    asserts:
      - template: templates/api-server-deployment.yaml
        hasDocuments:
          count: 2

  - it: keeps the POSTGRES_PASSWORD bootstrap key for an existingSecret without a password key override
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.existingSecret: legacy-secret
      postgres.persistence.enabled: false
    asserts:
      - template: templates/postgres.yaml
        documentSelector:
          path: kind
          value: StatefulSet
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: legacy-secret
                key: POSTGRES_PASSWORD

  - it: reads the standalone Postgres bootstrap password from the configured key with an existingSecret
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.existingSecret: crunchy-secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.password: pass
    asserts:
      - template: templates/postgres.yaml
        documentSelector:
          path: kind
          value: StatefulSet
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: crunchy-secret
                key: pass

  - it: keeps the fixed POSTGRES_PASSWORD key for the chart-generated standalone secret
    set:
      global.image.tag: test
      apiServer.tls.enabled: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.password: secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.password: pass
    asserts:
      - template: templates/postgres.yaml
        documentSelector:
          path: kind
          value: StatefulSet
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rms-rack-manager-postgres-credentials
                key: POSTGRES_PASSWORD

  - it: fails the drop-database job rendering on an invalid secret key override when the API server is disabled
    set:
      global.image.tag: test
      apiServer.enabled: false
      apiServer.tls.enabled: false
      databaseMode: external
      database.credentialsSecret: my-secret
      database.credentialsSecretKeys.username: my user
    asserts:
      - template: templates/drop-database-job.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.username must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "my user")'

  - it: fails the standalone Postgres rendering on an invalid secret key override when no other consumer renders
    set:
      global.image.tag: test
      apiServer.enabled: false
      dropDatabaseOnUninstall: false
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.existingSecret: crunchy-secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.password: my password
    asserts:
      - template: templates/postgres.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.password must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "my password")'

  - it: validates via the drop-database job rather than standalone Postgres when both would render
    set:
      global.image.tag: test
      apiServer.enabled: false
      dropDatabaseOnUninstall: true
      databaseMode: standalone
      postgres.enabled: true
      postgres.auth.existingSecret: crunchy-secret
      postgres.persistence.enabled: false
      database.credentialsSecretKeys.password: my password
    asserts:
      - template: templates/drop-database-job.yaml
        failedTemplate:
          errorMessage: 'database.credentialsSecretKeys.password must be a non-empty Secret key name matching [-._a-zA-Z0-9]+, and not ".", "..", or ".."-prefixed (got "my password")'
