suite: API server TLS secret selection
templates:
  - templates/api-server-deployment.yaml
  - templates/api-server-tls-secret.yaml
tests:
  - it: mounts the chart-rendered Secret when TLS material is supplied inline
    set:
      global.image.tag: test
      databaseMode: memory
      apiServer.tls.cert: cert
      apiServer.tls.key: key
      apiServer.tls.ca: ca
    asserts:
      - template: templates/api-server-tls-secret.yaml
        isKind:
          of: Secret
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.volumes
          content:
            name: api-server-tls
            secret:
              secretName: RELEASE-NAME-rack-manager-api-server-tls

  - it: mounts apiServer.tls.existingSecret when certificate automation is off
    set:
      global.image.tag: test
      databaseMode: memory
      apiServer.tls.existingSecret: rms-api-server-certificate
    asserts:
      - template: templates/api-server-tls-secret.yaml
        hasDocuments:
          count: 0
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.volumes
          content:
            name: api-server-tls
            secret:
              secretName: rms-api-server-certificate

  - it: mounts the chart-managed Certificate secret and skips the inline Secret
    set:
      global.image.tag: test
      databaseMode: memory
      certificates.enabled: true
    asserts:
      - template: templates/api-server-tls-secret.yaml
        hasDocuments:
          count: 0
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.volumes
          content:
            name: api-server-tls
            secret:
              secretName: rms-api-server-certificate

  - it: honours certificates.apiServer.secretName for both the Certificate and the mount
    set:
      global.image.tag: test
      databaseMode: memory
      certificates.enabled: true
      certificates.apiServer.secretName: site-api-server-tls
      apiServer.tls.existingSecret: rms-api-server-certificate
    asserts:
      - template: templates/api-server-deployment.yaml
        documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.volumes
          content:
            name: api-server-tls
            secret:
              secretName: site-api-server-tls
