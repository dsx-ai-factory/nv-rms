{{- if eq (include "rack-manager.useStandalonePostgres" .) "true" }}
{{- $auth := .Values.postgres.auth | default dict }}
{{- if not $auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rack-manager.fullname" . }}-postgres-credentials
  namespace: {{ include "rack-manager.namespace" . }}
  labels:
    {{- include "rack-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ $auth.username | quote }}
  password: {{ $auth.password | quote }}
  POSTGRES_PASSWORD: {{ $auth.password | quote }}
{{- end }}
{{- end }}
