{{- if .Values.apiServer.enabled }}
{{- include "rack-manager.validateSftpOptions" . -}}
{{- $firmwareUsePvc := eq (include "rack-manager.firmwareUsePvc" .) "true" }}
{{- $firmwarePvcName := include "rack-manager.firmwarePvcName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rms-api-server
  namespace: {{ include "rack-manager.namespace" . }}
  labels:
    {{- include "rack-manager.labels" . | nindent 4 }}
    app: rms-api-server
spec:
  selector:
    matchLabels:
      app: rms-api-server
  replicas: {{ .Values.apiServer.replicaCount }}
  {{- /* Rendered field by field (not toYaml passthrough) so null sub-keys are
       skipped like unset; kindIs guards (not `with`) keep maxSurge/maxUnavailable
       renderable at 0, which is falsy but meaningful. */}}
  {{- $strategy := .Values.apiServer.strategy | default dict }}
  {{- /* Kubernetes rejects a Deployment that sets rollingUpdate alongside
       type: Recreate; fail at render time instead of at apply time. The
       default "" keeps eq safe when type is null/absent. */}}
  {{- if and $strategy.rollingUpdate (eq ($strategy.type | default "") "Recreate") }}
  {{- fail "apiServer.strategy.rollingUpdate is not allowed when apiServer.strategy.type is Recreate; Kubernetes rejects that Deployment strategy combination" }}
  {{- end }}
  {{- /* Kubernetes also rejects a strategy that can neither surge nor replace
       pods: maxSurge 0 combined with maxUnavailable 0. The dict default keeps
       the field access safe when rollingUpdate is null/absent, and toString
       normalizes Helm's float64 numbers before the comparison. */}}
  {{- $ru := $strategy.rollingUpdate | default dict }}
  {{- if and (has ($ru.maxSurge | toString) (list "0" "0%")) (has ($ru.maxUnavailable | toString) (list "0" "0%")) }}
  {{- fail "apiServer.strategy.rollingUpdate cannot set both maxSurge and maxUnavailable to 0; Kubernetes rejects that Deployment strategy combination" }}
  {{- end }}
  {{- if or $strategy.type $strategy.rollingUpdate }}
  strategy:
    {{- with $strategy.type }}
    type: {{ . }}
    {{- end }}
    {{- with $strategy.rollingUpdate }}
    rollingUpdate:
      {{- if not (kindIs "invalid" .maxSurge) }}
      maxSurge: {{ .maxSurge }}
      {{- end }}
      {{- if not (kindIs "invalid" .maxUnavailable) }}
      maxUnavailable: {{ .maxUnavailable }}
      {{- end }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app: rms-api-server
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the Deployment when the rendered config.toml changes, since RMS
        # reads the mounted file only once at startup.
        checksum/config: {{ include "rack-manager.apiServerConfigToml" . | sha256sum }}
    spec:
      {{- with .Values.apiServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $imagePullSecrets := .Values.global.imagePullSecrets | default .Values.apiServer.imagePullSecrets }}
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (include "rack-manager.useStandalonePostgres" .) "true" }}
      # Waits for Postgres to be ready and ensures the named database exists before the
      # api-server container starts. Combining both steps here (rather than relying on a
      # post-install/post-upgrade Helm hook) avoids a deadlock when helm is invoked with
      # --wait or --atomic: hooks only run after all non-hook resources are Ready, but a
      # separate hook-based approach would prevent the pod from ever becoming Ready first.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rack-manager.databaseCredentialsSecret" . }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rack-manager.databaseCredentialsSecret" . }}
                  key: password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_NAME
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | default "prefer" | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              attempts=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 150 ]; then
                  echo "Timed out waiting for Postgres after $((150 * 2))s."
                  exit 1
                fi
                echo "Waiting for Postgres to be ready... ($attempts/150)"
                sleep 2
              done
              if psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$DB_NAME\";"; then
                echo "Database \"$DB_NAME\" created."
              else
                echo "CREATE DATABASE did not succeed; verifying database exists..."
                echo "SELECT 1 FROM pg_database WHERE datname = :'dbname'" \
                  | psql -d postgres -v ON_ERROR_STOP=1 -v dbname="$DB_NAME" -tA \
                  | grep -q 1
                echo "Database \"$DB_NAME\" already exists."
              fi
      {{- end }}
      containers:
        - name: rms-api-server
          image: "{{ .Values.apiServer.image.repository }}:{{ include "rack-manager.apiServerImageTag" . }}"
          imagePullPolicy: {{ include "rack-manager.apiServerImagePullPolicy" . }}
          ports:
            - containerPort: {{ .Values.apiServer.port }}
              name: http
            - containerPort: {{ .Values.apiServer.metrics.port }}
              name: metrics
          volumeMounts:
            - name: rms-config
              mountPath: /etc/rms
              readOnly: true
            - name: firmware-storage
              mountPath: {{ .Values.apiServer.firmwareMountPath }}
              readOnly: false
            {{- if .Values.apiServer.tls.enabled }}
            - name: api-server-tls
              mountPath: {{ .Values.apiServer.tls.secretMountPath }}
              readOnly: true
            {{- end }}
            {{- range $i, $cert := .Values.apiServer.switchCertCertificates }}
            - name: switch-cert-{{ $i }}
              mountPath: {{ printf "%s/%s" (required "apiServer.switchCertRoot must be set when switchCertCertificates is configured" $.Values.apiServer.switchCertRoot) $cert.domain }}
              readOnly: true
            {{- end }}
            {{- range $i, $cert := .Values.apiServer.clientTlsCertificates }}
            - name: client-tls-{{ $i }}
              mountPath: {{ printf "%s/%s" (required "apiServer.clientTlsRoot must be set when clientTlsCertificates is configured" $.Values.apiServer.clientTlsRoot) $cert.domain }}
              readOnly: true
            {{- end }}
          {{- $needsDbEnv := not (include "rack-manager.useMemoryPersistence" .) }}
          {{- if or .Values.apiServer.allowInsecure $needsDbEnv }}
          # All other configuration comes from the mounted config.toml. Only two
          # runtime inputs are injected here, both sourced outside the ConfigMap:
          #   * DATABASE_URL -- the connection string (with password) built from
          #     Secret-backed credentials, superseding the (empty) db_url.
          #   * RMS_ALLOW_INSECURE -- an independent production safeguard that must
          #     accompany `insecure = true` before RMS will bind plaintext gRPC, so
          #     a stale config alone cannot downgrade the API to unauthenticated
          #     plaintext.
          env:
            {{- if .Values.apiServer.allowInsecure }}
            - name: RMS_ALLOW_INSECURE
              value: "1"
            {{- end }}
            {{- if $needsDbEnv }}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: rms-database-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: {{ include "rack-manager.databaseCredentialsSecret" . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ include "rack-manager.databaseCredentialsSecret" . }}
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode={{ .Values.database.sslMode }}"
            {{- end }}
          {{- end }}
      volumes:
        - name: rms-config
          configMap:
            name: rms-api-config
        - name: firmware-storage
          {{- if $firmwareUsePvc }}
          persistentVolumeClaim:
            claimName: {{ $firmwarePvcName | quote }}
          {{- else }}
          hostPath:
            path: {{ .Values.apiServer.firmwareStoragePath }}
            type: DirectoryOrCreate
          {{- end }}
        {{- if .Values.apiServer.tls.enabled }}
        - name: api-server-tls
          secret:
            secretName: {{ include "rack-manager.apiServerTlsSecretName" . }}
        {{- end }}
        {{- range $i, $cert := .Values.apiServer.switchCertCertificates }}
        - name: switch-cert-{{ $i }}
          secret:
            secretName: {{ $cert.secret }}
            items:
              - key: ca.crt
                path: ca.pem
              - key: tls.crt
                path: client.pem
              - key: tls.key
                path: client.key
        {{- end }}
        {{- range $i, $cert := .Values.apiServer.clientTlsCertificates }}
        - name: client-tls-{{ $i }}
          secret:
            secretName: {{ $cert.secret }}
            items:
              - key: ca.crt
                path: ca.pem
              - key: tls.crt
                path: client.pem
              - key: tls.key
                path: client.key
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rms-api-server
  namespace: {{ include "rack-manager.namespace" . }}
  labels:
    {{- include "rack-manager.labels" . | nindent 4 }}
    app: rms-api-server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apiServer.port }}
      targetPort: {{ .Values.apiServer.port }}
      protocol: TCP
      name: http
    - port: {{ .Values.apiServer.metrics.port }}
      targetPort: {{ .Values.apiServer.metrics.port }}
      protocol: TCP
      name: metrics
  selector:
    app: rms-api-server
{{- end }}
