{{- if and (eq (include "rack-manager.useRmsPostgres" .) "true") .Values.rmsPostgres.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: rms-db-eso
  labels:
    {{- include "rack-manager.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - {{ include "rack-manager.namespace" . }}
  refreshTime: {{ .Values.rmsPostgres.externalSecret.refreshTime }}
  externalSecretSpec:
    secretStoreRef:
      name: {{ .Values.rmsPostgres.externalSecret.secretStoreRef.name }}
      kind: {{ .Values.rmsPostgres.externalSecret.secretStoreRef.kind }}
    target:
      name: {{ include "rack-manager.databaseCredentialsSecret" . }}
      deletionPolicy: {{ .Values.rmsPostgres.externalSecret.deletionPolicy }}
    {{- if .Values.rmsPostgres.externalSecret.refreshInterval }}
    refreshInterval: {{ .Values.rmsPostgres.externalSecret.refreshInterval }}
    {{- end }}
    dataFrom:
      - extract:
          key: {{ required "rmsPostgres.externalSecret.sourceSecretKey must be set when rmsPostgres.externalSecret.enabled is true" .Values.rmsPostgres.externalSecret.sourceSecretKey }}
          {{- if .Values.rmsPostgres.externalSecret.sourceSecretVersion }}
          version: {{ .Values.rmsPostgres.externalSecret.sourceSecretVersion }}
          {{- end }}
{{- end }}
