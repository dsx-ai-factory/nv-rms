#
# Local development Postgres for running the persistence-layer tests.
#
# Usage:
#     docker compose up -d postgres
#     export DATABASE_URL=postgres://postgres:postgres@localhost:5432/rms_test
#     cargo test --test persistence
#
# Without DATABASE_URL set, only the memory-backend tests run; the
# postgres-backend tests are skipped automatically by sqlx::test.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rms_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rms_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data

volumes:
  rms_postgres_data:
