[workspace]
members = [
    "crates/nvue_client",
    "crates/rackmanagementservice",
    "crates/redfish_client",
    "crates/redfish_test_support",
    "crates/rust_nvfwupd",
]
default-members = ["crates/rackmanagementservice"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
async-tempfile = { version = "0.8.0", features = ["uuid"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.5", features = ["async_tokio"] }
eyre = "0.6.12"
figment = { version = "0.10", features = ["toml", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
http = "1.4.0"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
indexmap = { version = "2", features = ["serde"] }
librms = { git = "https://github.com/NVIDIA/nv-rms-client", rev = "4bbd502d3d9822fb1dcb8d205b7edaecabb497a6", default-features = false }
mimalloc = { version = "0.1", features = ["override"] }
noyalib = { version = "0.0.8", features = ["compat-serde-yaml"] }
nv-redfish = { version = "0.11.0", default-features = false }
nvfwupd = { path = "crates/rust_nvfwupd" }
nvue_client = { path = "crates/nvue_client" }
portpicker = "0.1"
prometheus = "0.14"
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
rcgen = "0.13"
redfish_client = { path = "crates/redfish_client" }
redfish_test_support = { path = "crates/redfish_test_support" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "multipart", "stream"] }
russh = "0.62.6"
russh-sftp = "2"
rustls = "0.23"
rustls-pemfile = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "macros", "migrate"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26"
tokio-util = "0.7"
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic_prometheus_layer = "0.3"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
vergen-gitcl = { version = "9", features = ["build", "rustc"] }
wiremock = "0.5"
x509-parser = "0.17"
