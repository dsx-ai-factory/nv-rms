[package]
name = "rackmanagementservice"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "rust_nvfwupd", "redfish_test_support", "nvue_client"]
resolver = "3"

[features]
default = []
grpc-client = ["librms/client"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "multipart", "stream"] }
rustls = "0.23"
russh = "0.50"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "chrono",
    "macros",
    "migrate",
] }
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
tokio = "1"
x509-parser = "0.17"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
wiremock = "0.5"

[dependencies]
async-trait = { workspace = true }
axum = "0.8"
nvfwupd = { path = "rust_nvfwupd" }
nvue_client = { path = "nvue_client" }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
defer = "0.2.1"
eyre = "0.6.12"
futures = "0.3"
hex = { workspace = true }
http = "1.4.0"
librms = { git = "https://github.com/NVIDIA/nv-rms-client", rev = "7ec868a3efd4482256c1f4a3b9d6e6759065dd02", default-features = false, features = ["serde", "server"] }
mimalloc = { version = "0.1", features = ["override"] }
prost = "0.14"
prost-types = "0.14"
prometheus = "0.14"
rand = "0.10"
rand_core = "0.10"
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "multipart", "stream"] }
rustls = "0.23"
russh = { workspace = true }
russh-sftp = { workspace = true }
secrecy = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tonic_prometheus_layer = "0.3"
tower = "0.5"
tower-http = "0.6"
tower-layer = "0.3"
tower-service = "0.3.2"
uuid = { version = "1", features = ["v4"] }
x509-parser = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14"
vergen-gitcl = { version = "9", features = ["build", "rustc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
librms = { git = "https://github.com/NVIDIA/nv-rms-client", rev = "7ec868a3efd4482256c1f4a3b9d6e6759065dd02", default-features = false, features = ["client", "serde"] }
portpicker = "0.1"
rcgen = "0.13"
redfish_test_support = { path = "redfish_test_support" }
tar = "0.4"
tokio-rustls = "0.26"
wiremock = "0.5"

[[bin]]
name = "rack_manager_client"
path = "tests/client/src/main.rs"
required-features = ["grpc-client"]

[[bench]]
name = "scale"
harness = false
